spring.application.name=ProjectManagement
server.port=${PORT:8080}
server.tomcat.basedir=${SERVER_TOMCAT_BASEDIR:target/tomcat}
server.servlet.session.persistent=false
server.servlet.session.store-dir=target/tomcat/sessions

# Postgres Configuration (Neon DB / Local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/project_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:santhosh}

# Hibernate DDL: defaults to 'update' so database tables and data persist across Render restarts
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# Connection pool optimized for Neon serverless PostgreSQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4321,https://devflow-km.vercel.app}

# Session Cookie Configuration
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:Lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true